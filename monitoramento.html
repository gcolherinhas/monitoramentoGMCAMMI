/* Ajustes desta edição: tabela contínua, órbitas completas e rótulos transparentes. */
.planetLayer{pointer-events:none}
.planet{pointer-events:auto;cursor:help}
.planet .sphere,.planet .reading{pointer-events:none}
.planet .reading,.planet.jupiter .reading{background:transparent;border:0;box-shadow:none;padding:3px 6px;min-width:55px;text-shadow:0 2px 4px #020b18,0 0 10px #020b18}
.planet .reading strong{font-size:11px}.planet .reading small{font-size:9px}
.groups{display:grid;grid-template-rows:repeat(32,minmax(0,1fr));gap:2px;min-height:0;overflow:hidden;padding:4px 10px 10px}

@media (max-width:1049px) {
  html,body{width:100%;max-width:100%;overflow-x:hidden;overflow-y:auto}
  #app{width:100%;min-width:0;min-height:100dvh;height:auto;display:flex;flex-direction:column;overflow:visible}
  .top{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:13px;padding:17px 16px;min-width:0;height:auto}
  .title{min-width:0}.title h1{font-size:clamp(22px,4.5vw,30px);line-height:1.13}
  .topMetrics{min-width:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%}
  .metric{min-width:0;padding:10px 11px}.metric b{font-size:clamp(19px,3vw,25px)}
  .metric small{font-size:8px;line-height:1.25;overflow-wrap:anywhere}

  .queuePerson{min-width:108px;max-width:150px;flex:0 0 auto;scroll-snap-align:start}

  .sideTitles{display:none}

  .owner{grid-area:owner;display:flex;align-items:center;gap:8px;min-width:0}

  .nodeRow .cpu,.nodeRow .mem,.nodeRow .temp{display:flex;align-items:flex-start;gap:3px;flex-direction:column;min-width:0;text-align:left;font-size:12px;font-weight:900;padding:7px 9px;border-radius:8px;background:rgba(5,18,36,.55)}
  .nodeRow .cpu::before{content:'CPU';color:#88a9c7;font-size:9px;font-weight:850;letter-spacing:.08em}

  .bottom{padding:16px 12px}.bottomTitle b{font-size:16px}
  .resourceItems{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .resource b{font-size:20px}.resource small{font-size:9px}
}

  .groups>.nodeRow,.nodeRow{padding:10px 9px}
}

].map(([label,num,color])=>`<div class="metric" style="--color:${color}"><b>${num}</b><small>${label}</small></div>`).join('');
byId('resources').innerHTML=[['CPUs lógicas',fmt(sum('cpus'))],['RAM instalada',fmt(sum('ram_gb'))+' GB'],['Armazenamento',fmt(sum('disco_gb')/1000)+' TB'],['Máquinas com GPU',count(n=>n.grupo==='gpu')]].map(([label,value])=>`<div class="resource"><b>${value}</b><small>${label}</small></div>`).join('');
byId('update').innerHTML=`<strong>Gerado em</strong> ${esc(niceDate(DADOS.coleta_em))}`;
function initials(s){return String(s||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('')}
function avatar(n){if(!n.usuario)return '<span class="avatar">+</span>';return n.foto?`<img alt="" src="${esc(n.foto)}" referrerpolicy="no-referrer" onerror="this.outerHTML='&lt;span class=&quot;avatar&quot;&gt;${esc(initials(n.usuario))}&lt;/span&gt;'">`:`<span class="avatar">${esc(initials(n.usuario))}</span>`}
// A ordem da fila corresponde às linhas da aba `fila` no XLSX (não é reordenada).
const WAITLIST=Array.isArray(DADOS.fila)?DADOS.fila:[];
byId('queueCount').textContent=WAITLIST.length;
const queueKind=t=>String(t||'').replace(/^MERCURIO/i,'MERCÚRIO ').replace(/JUPTER/i,'JUPTER').trim();
byId('queueList').innerHTML=WAITLIST.length?WAITLIST.map((q,i)=>{
 const color=q.familia==='Mercúrio'?'#fb776e':q.familia==='Jupter'?'#63c9fa':'#aac0d2';
 const face=`<span class="queueInitial">${esc(initials(q.nome))}</span>${q.foto?`<img src="${esc(q.foto)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}`;
 const cleanType=queueKind(q.tipo);
 return `<div class="queuePerson" style="--queueColor:${color}" title="${i+1}º: ${esc(q.nome)} · ${esc(q.tipo)} · ${q.quantidade||1} máquina(s)"><div class="queueCircle"><span class="queueOrdinal">${i+1}</span>${face}</div><div class="queueText"><strong>${esc(q.nome)}</strong><small>${esc(cleanType)}</small></div></div>`;
}).join(''):'<span class="queueEmpty">Nenhuma solicitação registrada</span>';
const cpuValue=n=>n.cpu==null?'—':`${fmt(n.cpu)}%`;
const memValue=n=>n.mem==null?'—':`${fmt(n.mem)}%`;
const tempValue=n=>n.temp==null?'—':`${fmt(n.temp)}°C`;
// Uma única listagem contínua: todas as Mercúrio, depois todas as Jupter.
const machinesOrdered=[...NODES].sort((a,b)=>(a.familia!=='Mercúrio')-(b.familia!=='Mercúrio') || a.numero-b.numero);
byId('groups').innerHTML=machinesOrdered.map(n=>`<div class="nodeRow ${n.ocupacao==='disponivel'?'freeRow':''}" title="${esc(n.nome)} · ${esc(n.usuario||'Disponível')}"><div class="machine ${n.familia==='Jupter'?'jupiter':''}"><i class="dot ${n.ocupacao==='atribuida'?'atribuida':'disponivel'}"></i><span class="name">${esc(n.nome)}</span></div><span class="cpu ${n.cpu==null?'missing':n.cpu>=75?'high':''}">${cpuValue(n)}</span><span class="mem ${n.mem==null?'missing':''}">${memValue(n)}</span><span class="temp ${n.temp==null?'missing':''}">${tempValue(n)}</span><div class="owner ${n.usuario?'':'free'}">${avatar(n)}<span class="name">${esc(n.usuario||'Disponível')}</span></div></div>`).join('');
let seed=37621;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
byId('stars').innerHTML=Array.from({length:130},()=>`<i style="--x:${(rand()*100).toFixed(2)}%;--y:${(rand()*100).toFixed(2)}%;--op:${(.12+rand()*.6).toFixed(2)};--dur:${(2+rand()*5).toFixed(1)}s"></i>`).join('');
// A categoria continua definida na planilha: 8 trilhas distribuídas em 5 classes.
// Somente computadores ATRIBUÍDOS entram em órbita; disponíveis ficam na lista lateral.
const RINGS=[
 {group:'servicos', rx:.33, ry:.12, period:90},
 {group:'baixo',rx:.40,ry:.17,period:100},
 {group:'medio',rx:.47,ry:.22,period:108},
 {group:'medio',rx:.54,ry:.265,period:116},
 {group:'medio',rx:.61,ry:.31,period:124},
 {group:'alto',rx:.68,ry:.355,period:132},
 {group:'alto',rx:.75,ry:.394,period:140},
 {group:'gpu',rx:.82,ry:.432,period:148}
];
const partition=new Map(RINGS.map((_,i)=>[i,[]]));
GROUPS.forEach(g=>{let i=0;for(const n of listOf(g).filter(n=>n.ocupacao==='atribuida')){
 const ring=g.rings[i%g.rings.length];partition.get(ring).push(n);i++;
}});
const planets=[];
const layer=byId('planetLayer'),popup=byId('hoverCard');
let hovered=null;
const stage=byId('sky'),railSvg=byId('railSvg'),sun=byId('sun');
function positionPopup(p){
 if(!p||!p.el||!stage.clientWidth)return;
 const r=p.el.getBoundingClientRect(),a=stage.getBoundingClientRect();
 const popupWidth=popup.getBoundingClientRect().width||258,popupHeight=Math.max(94,popup.offsetHeight||94);
 let x=r.left-a.left+r.width+14;
 if(x+popupWidth>stage.clientWidth-10)x=r.left-a.left-popupWidth-12;
 x=Math.min(Math.max(9,x),Math.max(9,stage.clientWidth-popupWidth-9));
 const y=Math.max(10,Math.min(r.top-a.top-22,stage.clientHeight-popupHeight-12));
 popup.style.left=x+'px';popup.style.top=y+'px';
}
// Mensagens fornecidas pelo grupo. Sorteio apenas ao entrar no planeta.
const MENSAGENS_GERAIS=[
 'Olá, estou usando esta máquina!',
 'Olá. Em uso! Favor não mexer.',
 'Oi. Sessão ativa. Não feche!',
 'Processando em background. Não interrompa.',
 'Máquina ocupada. Volto logo.',
 'Olá!. Em uso. Não reinicie.',
 'Ocupada gerando café e código.',
 'Silêncio, o script está meditando.',
 'Processando mais que meu cérebro na segunda.',
 'Olá! A CPU tá trabalhando, eu tô no café.',
 'Eu sumi, mas o script ficou.',
 'A CPU tá fritando, deixa ela em paz.',
 'GROMACS gerando frames!',
 'mdrun rodando!!!',
 'Oi. Estou processando bilhões de interações.',
 'Se fechar, meu .xtc corrompe.',
 'Faltam N dias de simulação. Não toque.',
 'Simulando até o infinito. Não toque!',
 'Muitos nanossegundos pela frente.',
 'Caixa enorme, CPU chorando.',
 'Não mexe, é pro meu artigo!',
 'Se fechar, o Reviewer 2 ganha.',
 'GROMACS em 4K 120FPS.',
 'mdrun na dificuldade Ultra Hard.',
 'Olá! A casa é sua, o .xtc é meu.',
 'Oi! Sente e assista o GROMACS rodar.',
 'Welcome! Só olhe, não toque.',
 'Olá! O cooler tá tocando Heavy Metal.',
 'Oi! "Don\'t Stop Me Now".',
 'Olá! Kernel fritando, não dê Ctrl+C.',
 'Oi! SSH liberado, terminal blindado.',
 'Forças de Van der Waals no talo.',
 'Que a Força esteja com o GROMACS!',
 'GROMACS na velocidade da luz.'
];
const MENSAGENS_GPU=[
 'Olá. Estou fritando os CUDA cores.',
 'Se fechar, o driver da NVIDIA chora.',
 'Usando 100% da GPU, 0% do meu cérebro.',
 'Deixa a RTX trabalhar em paz!',
 'Olá! Entre, mas deixe a GPU em paz.',
 'Energia cinética no talo na GPU',
 'A GPU tá decolando rumo a Marte.'
];
function saudacao(p){
 if(p.n.cpu===0)return 'zzz...zzz...zzz';
 const frases=p.n.grupo==='gpu'?[...MENSAGENS_GERAIS,...MENSAGENS_GPU]:MENSAGENS_GERAIS;
 let idx=Math.floor(Math.random()*frases.length);
 if(frases.length>1 && idx===p.ultimaMensagem)idx=(idx+1)%frases.length;
 p.ultimaMensagem=idx;
 return frases[idx];
}
function showGreeting(p){
 if(!p.n.usuario)return;
 hovered=p;
 const n=p.n;
 byId('hoverGreeting').textContent=saudacao(p);
 const photo=n.foto?`<img src="${esc(n.foto)}" alt="Foto do responsável" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${esc(initials(n.usuario))}'}))">`:
   `<span>${esc(initials(n.usuario))}</span>`;
 byId('hoverPhoto').innerHTML=photo;
 byId('hoverName').textContent=n.usuario;
 byId('hoverMachine').textContent=n.nome+' · CPU '+cpuValue(n);
 popup.classList.add('show');popup.setAttribute('aria-hidden','false');
 positionPopup(p);
}
function hideGreeting(p){if(hovered===p){hovered=null;popup.classList.remove('show');popup.setAttribute('aria-hidden','true');}}
for(let ring=0;ring<RINGS.length;ring++){
 const slot=partition.get(ring);
 slot.forEach((n,idx)=>{
  // O estado orbital vem apenas do cadastro de ocupação da planilha.
  const el=document.createElement('div');
  el.className=`planet ${n.familia==='Jupter'?'jupiter':'mercury'}`;
  const clean=n.sigla.replace(/^\*/,'');
  el.style.setProperty('--cpuGlow',String(n.cpu==null?.12:Math.min(1,Math.max(.08,n.cpu/100))));
  el.innerHTML=`<span class="sphere">${esc(clean.slice(1))}</span><span class="reading"><strong>${esc(clean)}</strong><small>CPU ${cpuValue(n)}</small></span>`;
  el.setAttribute('aria-label',`${n.nome}, CPU ${cpuValue(n)}`);
  layer.appendChild(el);
  const initial=((idx+.18*ring)/slot.length+.11*ring)%1;
  // Nó atribuído sem uso de CPU (0%) fica parado, mas visível na órbita.
  const stationary=n.cpu===0;
  const phase=stationary?Math.min(.87,Math.max(.13,initial)):initial;
  const p={n,el,ring,idx,total:slot.length,phase,speed:0,stationary};planets.push(p);
  el.tabIndex=0;el.addEventListener('mouseenter',()=>showGreeting(p));el.addEventListener('mouseleave',()=>hideGreeting(p));el.addEventListener('focus',()=>showGreeting(p));el.addEventListener('blur',()=>hideGreeting(p));
  el.addEventListener('click',()=>{if(matchMedia('(hover: none)').matches)showGreeting(p);});
 });
}
document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch' && hovered && !e.target.closest('.planet'))hideGreeting(hovered);});
let geom=null;
function drawScene(){
 const w=stage.clientWidth,h=stage.clientHeight,cx=w<700?w*.12:w*.085,cy=h*.51;const orbitScale=w<700?.78:.90;geom={w,h,cx,cy,orbitScale};
 sun.style.left=cx+'px';sun.style.top=cy+'px';railSvg.setAttribute('viewBox',`0 0 ${w} ${h}`);
 // Elipses COMPLETAS; a metade esquerda permanece parcialmente fora da tela.
 railSvg.innerHTML=RINGS.map(r=>{
  const rx=w*r.rx*orbitScale,ry=h*r.ry,c=lookup[r.group].color;
  return `<ellipse class="orbitGlow" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" stroke="${c}"/><ellipse class="orbit ${r.group}" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`;
 }).join('');
 if(hovered)positionPopup(hovered);
}
addEventListener('resize',drawScene,{passive:true});drawScene();
// A maior temperatura válida entre os planetas em movimento define a velocidade máxima.
// As demais são reescaladas linearmente (25% a 100% da velocidade máxima).
// Temperaturas ausentes usam velocidade mínima, sem inventar medição.
const movingTemps=planets.filter(p=>!p.stationary && Number.isFinite(p.n.temp)).map(p=>p.n.temp);
const minTemp=movingTemps.length?Math.min(...movingTemps):null;
const maxTemp=movingTemps.length?Math.max(...movingTemps):null;
const MAX_ORBIT_MS=60000; // planeta mais quente: ciclo de aproximadamente 60 s
for(const p of planets){
 if(p.stationary){p.speed=0;continue;}
 if(!Number.isFinite(p.n.temp) || minTemp===null){p.speed=.25;continue;}
 const norm=maxTemp===minTemp?1:Math.max(0,Math.min(1,(p.n.temp-minTemp)/(maxTemp-minTemp)));
 p.speed=.25+.75*norm;
}
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=-Infinity;
function frame(time){
 if(geom&&time-last>38){
  // Cada planeta acumula a própria fase; hover não altera o relógio dos outros.
  // A pausa preserva a fase exata, sem salto ao retirar o mouse.
  const elapsed=Number.isFinite(last)?Math.min(150,Math.max(0,time-last)):0;
  last=time;
  const {w,h,cx,cy,orbitScale}=geom;
  for(const p of planets){
   if(hovered!==p && !reduceMotion && p.speed>0){
    p.phase=(p.phase+elapsed*p.speed/MAX_ORBIT_MS)%1;
   }
   const r=RINGS[p.ring],phase=p.phase;
   // De baixo para cima no semicírculo visível; depois reaparece embaixo.
   const theta=Math.PI*phase,rx=w*r.rx*orbitScale,ry=h*r.ry;
   const x=cx+rx*Math.sin(theta),y=cy+ry*Math.cos(theta);
   const edge=Math.min(1,phase/.075,(1-phase)/.075);
   p.el.style.opacity=String(Math.max(0,edge));
   p.el.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) translate(${w<700?'-70%':'-35%'},-50%)`;
   p.el.style.zIndex='20';
  }
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// Sem cliques: somente mouse-over ou foco exibem a saudação; recarrega o HTML publicado periodicamente.
if(RELOAD_SECONDS>0)setInterval(()=>{if(location.protocol==='file:')location.reload();else{const u=new URL(location.href);u.searchParams.set('v',Date.now().toString());location.replace(u.href);}},RELOAD_SECONDS*1000);
</script>
